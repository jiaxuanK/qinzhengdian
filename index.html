<!-- PWA：注册 Service Worker，实现「装到手机桌面 + 离线可玩」 -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  /* file:// 下 SW 不可用，直接跳过；http(s) 才注册 */
  if (location.protocol === 'file:') return;
  window.addEventListener('load', function () {
    /* PWA Service Worker 注册：file:// 打开时会因 CORS 失败，正常（忽略 warn） */
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('service-worker.js', { scope: './' })
        .then(function(reg){ console.log('[PWA] SW 已注册', reg.scope); })
        .catch(function(e){ console.warn('[PWA] SW 注册失败（file:// 下属正常）：', e.message); });
      /* 新版本 SW 就绪时，提示用户刷新 */
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        console.log('[PWA] 检测到新版本 SW，刷新即可生效');
      });
    }
  });
})();
</script>
